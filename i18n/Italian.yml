    poll_type_help: "Tipo di sondaggio attuale: %{poll_type}\n\n👍 *Voto singolo:*\nOgni utente vota una volta sola. E' il tipo di sondaggio predefinito.\n\n📅 *Doodle:*\nGli utenti possono votare 'sì', 'no' o 'forse' per ogni opzione. Ideale per mettersi d'accordo su una data.\n\n🎮 *Votazione a blocco:*\nOgni utente può votare per tutte (o meno) le opzioni. Ideale per trovare le scelte più popolari in un gruppo, ad esempio i giochi che dovrebbero venir giocati al lan party.\n\n🎮 *Voto limitato:*\nOgni utente ha un numero fisso (e limitato) di voti da distribuire, uno per opzione.\nCome il voto a blocco, ma con scelte limitate. Ideale per limitare il numero di possibili vincitori del sondaggio (ad esempio, solo 4 giochi per il lan party).\n\n📊 *Voto comulativo:*\nOgni utente ha un numero di voti fisso (e limitato) che può distribuire come preferiscono (anche dandone di più a una opzione). Ha più profondità di un voto limitato, dato che permette agli utenti di votare più volte la stessa opzione.\n\n🛒 *Voti illimitati* (o lista della spesa) 😎\nOgni utente può votare tante volte quanto vuole qualsiasi opzione.\nIdeale per capire quanta roba servirà per tutti al prossimo giro al festival.\n"
    results_not_visible: 'I risultati saranno visibili solo alla chiusura del sondaggio'
