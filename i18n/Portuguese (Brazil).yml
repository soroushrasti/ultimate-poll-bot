        single_added: "*%{option}* adicionado. 👍\nVocê pode:\n- Enviar uma mensagem para adicionar uma *nova opção* ou\n- Tocar em *Abrir calendário* para escolher uma data e adicioná-la como opção ou\n- Tocar em *Concluído* para terminar."
        multiple_added: 'Opções adicionadas:'
        finished: 'Todas as opções já foram adicionadas'
    poll_type_help: "Tipo de enquete atual: *%{poll_type}* \n\n👍 *Voto Único:* \nTodo usuário pode enviar um único voto. É o modo de votação padrão e normal. \n\n📅 *Painel:* \n Os usuários podem votar em `sim`,`não` ou `talvez` para cada opção. Ótimo para encontrar uma data. \n↕ *Voto de Prioridade*\nOs usuários classificam as opções por preferência.\nAs opções recebem pontos dependendo da posição no ranking.\n\n 🎮 *Votação em bloco:* \n O usuário pode votar em todas as opções (ou menos). É como um painel, mas você só pode votar em `sim`.\nÚtil para encontrar as opções mais procuradas em um grupo, por exemplo, que jogos devem ser jogados em uma festa. \n\n 🎮 *Voto limitado:* \nO usuário tem uma quantidade limitada de votos (mas somente um voto por opção). \nÉ como a votação em bloco, mas as pessoas precisarão priorizar.\nEste modo é bom para limitar a quantidade de vencedores possíveis, por exemplo, se você quiser apenas 4 jogos na sua festa. \n\n📊 *Votação acumulada:* \nO usuário tem uma quantidade limitada de votos que pode distribuir como quiser (podendo, inclusive, dar vários votos em uma opção). \nEsse modo é um pouco mais complexo que o Voto Limitado, pois permite que os usuários votem em uma opção várias vezes. \n\n 🛒 *Votos ilimitados * (ou Lista de Compras) 😎 \nO usuário pode votar quantas vezes quiser em qualquer opção que quiser. \nIsso é bom se você quiser, por exemplo, determinar quanto cada um irá trazer de cada item em um evento.\n"
    results_not_visible: 'Os resultados não são visíveis até que a enquete seja fechada'
    results_visible: 'Os resultados são visíveis diretamente'
    anonymity: 'Nomes não visíveis'
    no_anonymity: 'Nomes visíveis'
