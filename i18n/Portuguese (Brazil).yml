        first: "É possível enviar várias opções ao mesmo tempo, cada uma em uma linha. \nTambém é possível incluir uma descrição para a opção separando por um hífen. Exemplo: `Hambúrguer - porque é delicioso`\n*Agora, envie uma mensagem com a nova opção.*\n\n(Se quiser sugerir uma opção de data, toque em `Abrir calendário`)\n"
