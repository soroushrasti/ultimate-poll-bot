misc:
    start: "🌟Bem-vindo ao *ULTIMATE* pollbot 🌟 \n\nBasta enviar /create ou tocar no botão abaixo para começar a criar enquetes. Tudo será explicado no processo. \n\n🌐 Você pode escolher outro idioma nas configurações 🌐 \n❓ Envie /help para obter mais informações ❓ \n\n💡 _Curiosidade_: Você também pode me enviar uma enquete normal do Telegram! 💡\n\nEste bot é de código aberto no [GitHub] (https://github.com/). \n"
    help:
        intro: "Existem algumas configurações para suas enquetes. \nBasta escolher a categoria ou apenas ler tudo 😉. \n\nCaso você queira apenas criar uma enquete, envie /create \n"
        creation: "🌟 *Criação:* \n\n Para criar uma enquete, basta escrever ou tocar em /create. \n Para cada enquete, você pode especificar várias configurações iniciais: \n\n*Tipo de enquete:* Os vários tipos são explicados em detalhes no menu tipo de enquete. \n*Anonimato:* Você pode deixar sua enquete anônima, o que resulta em nenhum nome sendo exibido! Isso é permanente e para todos.\n*Resultados visíveis:* Nesse modo, os votos somente se tornam visíveis após o encerramento da enquete. Isso é ótimo para evitar a possibilidade de [voto tático](https://pt.wikipedia.org/wiki/Voto_tático) e o efeito de [ancoragem](https://pt.wikipedia.org/wiki/Efeito_de_ancoragem) \n\n-> *Atenção: Uma enquete encerrada com resultados ocultos permanecerá fechada!:* \nA reabertura de uma enquete permitiria a um usuário (especificamente ao criador da enquete), examinar o resultado e colocar seu próprio voto de maneira que resultaria em uma possível vantagem para ele (voto tático). \n"
        settings: "⚙️ *Configurações:* \n\nConfigurações adicionais da enquete podem ser ajustadas após sua criação: \n\n*Idioma*: É possível alterar o idioma somente para a enquete\n*Anonimato:* Uma enquete pode ser feita anonimamente. \n*Data de encerramento:* É possível definir uma data de encerramento na qual a enquete será encerrada automaticamente.\n*Opções:* Novas opções podem ser adicionadas à enquete e opções existentes podem ser removidas neste menu.\n*Opções do usuário:* Você pode permitir que usuários adicionem opções à sua enquete.\n\n*---- Submenu de estilo: ----*\n\n*Porcentagem:*\n_A linha de porcentagem de cada opção pode ser ocultada no menu de configurações. _\n\n*Votos em uma opção:*\n_É possível ocultar o total de votos em uma opção._\n\n*Consolidar votos:*\n_Caso sua enquete tenha muitos votos, a informação pode ficar muito confusa. Consolidar os votos trará uma visualização mais agradável._\n\n*Ordem:*\n_É possível alterar a ordem na qual usuários ou opções são exibidos nos resultados._ \n \n"
        notifications: "📣 *Notificações:* \n\nSe você habilitar notificações para o seu chat, o bot vai mandar uma mensagem 1 dia, 6 horas e 1 hora antes de a enquete fechar.\nEste é apenas um recurso para lembrar todos do grupo que uma enquete irá fechar logo, e para deixar fácil de achar a mensagem da enquete novamente 😉.\n\nPara habilitar as notificações em seu chat siga os seguintes passos:\n*1.* Crie uma enquete;\n*2.* Coloque uma data de termino no menu de configurações;\n*3.* Vá para o chat que você deseja que seja notificado (o pollbot precisa estar no grupo antes de a enquete ser compartilhada ou você precisará compartilhar ela de novo);\n*4.* Responda com /notify na mensagem da enquete que voce selecionou via @ultimate\\_pollbot;\n*5.* Selecione a enquete correta.\n\nEste procedimento todo é infelizmente complicado, pois o Telegram não permite a detecção de mensagens de bots nos grupos 😐.\nAssim, nós não sabemos qual enquete é postada em cada grupo e tudo precisa ser feito manualmente.\n"
        management: "🕰 *Achar enquetes antigas:* \n\nHá dois comandos /list e /list\\_closed, que permite você achar e gerenciar suas enquetes antigas.\n\n⚠️ *Apagar enquetes:* \n\nVocê pode apagar enquetes individualmente no respectivo menu da enquete.\nTambém há formas de apagar todas as enquetes no menu de configurações (comando /settings).\n"
        languages: "🌐 *Idioma:* \n\nUltimate pollbot suporta vários idiomas, mas apenas o inglês é oficialmente mantido."
        bugs: "⚠️ *Há um bug desconhecido que não vai embora!!* 😩\n\nEu normalmente recebo notificações assim que algo quebra, mas podem haver alguns bugs que passam desapercebidos!\nCaso o bug não tenha sido corrigido em um ou dois dias, por favor escreva um ticket no [Github](https://github.com/)."
        feature: "*Eu gostaria de ver um recurso específico sendo adicionado ao bot* \n\n Confira o quadro oficial para acompanhamento de recursos: https://trello.com/b/L3XfSRkN/ultimate-poll-bot\n\n Alguns recursos *não serão implementados*, pois não correspondem às diretrizes do projeto. \n\n Alguns recursos solicitados com frequência já estão planejados e *aguardando que alguém os desenvolva*. \n"
    error: "Ocorreu um erro desconhecido. Provavelmente recebi uma notificação sobre isso e tentarei corrigi-lo o mais rápido possível.\nCaso o bug não tenha sido corrigido em um ou dois dias, por favor envie um ticket no [Github](https://github.com/)."
    start_after_results: 'Ei! Basta enviar /create para criar sua própria enquete ☺️'
    over_3000: "⚠️ Sua enquete já tem mais de *3.000 caracteres*; tente mantê-la curta e abaixo de 3.000, ou, melhor ainda, abaixo de 2.500 🙏. \n\nO Telegrama tem um máximo de 4.096 caracteres por mensagem e eu preciso exibir os votos além do seu texto inicial. Toda enquete com mais caracteres do que isso, simplesmente *irá parar de funcionar*. \nTentamos lidar com isso da melhor forma possível, consolidando os votos para economizar espaço, mas isso tem um limite. \n\nPara pesquisas com muito texto e com mais de 10 ou 15 opções, é melhor usar uma ferramenta externa como [Doodle](https://doodle.com/) \n"
    over_4000: "⚠️ Sua enquete tem mais de *4.000 caracteres*. É muito grande para exibí-la em uma única mensagem. Por favor, tente mantê-la curto e com menos de 3.000 caracteres ou, melhor ainda, com menos de 2.500 🙏. \n\nO Telegrama tem um máximo de 4.096 caracteres por mensagem e ainda será necessário exibir os votos além do seu texto inicial. Toda enquete com mais caracteres do que isso simplesmente *irá parar de funcionar*. \nTentamos tratar isso da melhor forma possível, mas estou de mãos atadas nessa. \n\nPara pesquisas muito longas e com muitas opções, é melhor usar uma ferramenta externa como [Doodle](https://doodle.com/)\n"
    too_long: "Ei! \n\nSinto muito, mas sua enquete ficou muito longa. Você provavelmente enviou um grande número de opções ou adicionou um texto descritivo muito longo (ou ambos). 😬 \n\nComo o Telegram permite apenas 4096 caracteres por mensagem, não consigo mostrar nenhuma enquete maior que isso. 😐 \n\nPor favor, tente manter os textos das descrições e das opções curtos e, se você quiser usar enquetes com muitas opções, talvez seja melhor usar uma ferramenta externa como [Doodle] (https://doodle.com/). \n\nUma maneira de resolver esse problema pode ser removendo opções (o administrador pode fazer isso). \n\n 👇 Você ainda pode votar e ver os resultados abaixo. 👇\n \n \n"
    stop: 'Você não poderá mais usar o bot. Para reiniciá-lo envie /start'
    deletion_warning: "⚠️ * Atenção * ⚠️ \n\n 1. Todas as informações pessoais serão excluídas. \n 2. Os votos nas enquetes ativas serão removidos. \n 3. Todas as suas enquetes ativas ou fechadas serão excluídas. \n\n O que não pode ser excluído: \n\n 1. Votos em enquetes excluídas não podem ser removidos, votos em enquetes fechadas não podem ser removidos. \n 2. As enquetes excluídas não podem ser removidas, pois já foram excluídas do banco de dados. \n\n ☢️ * PERIGO * ☢️ \n"
    too_many_options: 'Sua enquete tem muitas opções para exibir uma única mensagem :('
    final_deletion_warning: '*Tem certeza ABSOLUTA disso?*'
